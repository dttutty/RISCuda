[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "gpu-rv32-python"
version = "0.1.0"
description = "RISC-V on CUDA: run whole integer Python programs in one GPU kernel"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["ziglang==0.14.1"]

[project.urls]
Repository = "https://github.com/dttutty/RISCV_ON_CUDA"
Issues = "https://github.com/dttutty/RISCV_ON_CUDA/issues"

[project.scripts]
gpu-rv32 = "gpu_rv32.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gpu_rv32"]
